global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    environment: vpn-noc-lab

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: vpn-exporter
    static_configs:
      - targets:
          - site-a:9586

  - job_name: blackbox-icmp
    metrics_path: /probe
    params:
      module: [icmp_ipv4]
    static_configs:
      - targets:
          - 10.77.0.2
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: site-a:9115

  - job_name: blackbox-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - 10.77.0.2:8080
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: site-a:9115

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_health]
    static_configs:
      - targets:
          - http://10.77.0.2:8080/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: site-a:9115

  - job_name: blackbox-dns
    metrics_path: /probe
    params:
      module: [dns_service_internal]
    static_configs:
      - targets:
          - 10.77.0.2
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: site-a:9115
