name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: false

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck wireguard-tools

      - name: Validate source
        run: |
          test -z "$(gofmt -l ./cmd)"
          go test -race ./...
          go vet ./...
          shellcheck scripts/*.sh lab/node/entrypoint.sh
          jq empty monitoring/grafana/dashboards/vpn-noc-overview.json

      - name: Generate ephemeral WireGuard configuration
        run: go run ./cmd/keygen

      - name: Validate Compose and monitoring configuration
        run: |
          docker compose config --quiet
          docker run --rm --entrypoint /bin/promtool \
            -v "${PWD}/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.13.2 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint /bin/promtool \
            -v "${PWD}/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.13.2 test rules /etc/prometheus/rule_tests.yml
          docker run --rm --entrypoint /bin/amtool \
            -v "${PWD}/monitoring/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:v0.33.1 check-config /etc/alertmanager/alertmanager.yml

      - name: Build and start lab
        run: |
          sudo modprobe wireguard || true
          timeout 180 docker compose up -d --build --wait

      - name: Run integration smoke test
        run: ./scripts/smoke-test.sh

      - name: Show diagnostics after failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200

      - name: Stop lab
        if: always()
        run: docker compose down --volumes --remove-orphans
